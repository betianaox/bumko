<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0A0A0F" />
    <title>Stokki</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <script>
      // Antes del primer pintado: evita el destello del tema equivocado.
      // Tiene que coincidir con src/context/ThemeContext.jsx.
      (function () {
        try {
          var p = localStorage.getItem('stokki-theme') || 'system'
          var light = window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.dataset.theme = p === 'system' ? (light ? 'light' : 'dark') : p
        } catch (e) { document.documentElement.dataset.theme = 'dark' }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
